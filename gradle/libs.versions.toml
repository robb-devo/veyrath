# Single source of truth for every pinned version in the build.
# Minecraft stack versions are documented (with reasoning) in docs/TECHNICAL_DECISIONS.md.
[versions]
java = "25"
minecraft = "26.3"
fabric-loader = "0.19.5"
fabric-loom = "1.17.21"
# UNVERIFIED placeholder: the Fabric maven is unreachable from the cloud build machine and the
# 26.3 release post does not name a Fabric API version. On the first device build, pin the newest
# "*+26.3" entry of https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/maven-metadata.xml
# and record it in docs/DEPENDENCIES.md.
fabric-api = "0.165.0+26.3"
# Distant Horizons 3.3.4-26.3 (Modrinth version, published 2026-09-29) implements DH API 7.2.0
# (verified in DH's source, tag 3.3.4). Whether a separate API 7.2.0 artifact is on the Modrinth
# maven is UNVERIFIED; the build compiles against the DH mod jar instead.
distanthorizons = "3.3.4-26.3"
distanthorizons-api = "7.2.0"
junit = "5.13.4"

[libraries]
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-launcher = { module = "org.junit.platform:junit-platform-launcher" }

[plugins]
# Minecraft 26.1+ is unobfuscated: Fabric's 26.1 post says to use the new plugin id
# "net.fabricmc.fabric-loom" (the old "fabric-loom" / "fabric-loom-remap" ids are for remapping).
fabric-loom = { id = "net.fabricmc.fabric-loom", version.ref = "fabric-loom" }
